name: Build, Test, and Deploy Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish App
        run: dotnet publish -c Release -r linux-x64 --self-contained true -o ./publish

      - name: Copy files to Droplet
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          source: "./publish/*"
          target: "/var/www/clocktower"
          strip_components: 1

      - name: Update Service and Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          script: |
            chmod +x /var/www/clocktower/Clocktower.Server
            
            cat <<EOF > /etc/systemd/system/clocktower.service
            [Unit]
            Description=Clocktower Server
            After=network.target

            [Service]
            WorkingDirectory=/var/www/clocktower
            ExecStart=/var/www/clocktower/Clocktower.Server
            Restart=always
            RestartSec=10
            KillSignal=SIGINT
            SyslogIdentifier=clocktower-server
            Environment=ASPNETCORE_ENVIRONMENT=Production
            Environment=ASPNETCORE_URLS=http://*:5000

            # Secrets from GitHub
            Environment=Secrets__DiscordBotToken=${{ secrets.DISCORD_BOT_TOKEN }}
            Environment=Secrets__DiscordClientId=${{ secrets.DISCORD_CLIENT_ID }}
            Environment=Secrets__DiscordClientSecret=${{ secrets.DISCORD_CLIENT_SECRET }}
            Environment=Secrets__ServerUri=${{ vars.CLOCKTOWER_SERVER_URI }}
            Environment=Secrets__FeUri=${{ vars.FE_URI }}
            Environment=Secrets__Jwt__SigningKey=${{ secrets.JWT_SIGNING_KEY }}
            Environment=Secrets__Jwt__Audience=clocktower-user

            [Install]
            WantedBy=multi-user.target
            EOF
            
            chmod 600 /etc/systemd/system/clocktower.service

            systemctl daemon-reload
            systemctl restart clocktower.service